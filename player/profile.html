<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Player Profile - TurfGo</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="theme-player">
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-logo">⚽ TurfGo</div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="book-turf.html">Book Turf</a>
                <a href="my-bookings.html">My Bookings</a>
                <a href="profile.html" class="active">Profile</a>
                <a href="../index.html">Main Index</a>
                <a href="../logout.html">Logout</a>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="topbar-title">Player Profile</div>
                <div class="topbar-user">
                    <span class="role-badge">Player</span>
                    <span>Jisan Al annan</span>
                    <div class="avatar">JB</div>
                </div>
            </header>
            <main class="content">
                <div class="page-header">
                    <h1>Player Profile &amp; Account Settings</h1>
                </div>
                <section class="card">
                    <h3 class="card-title">Personal Profile Information</h3>
                    <form action="profile.html" method="POST">
                        <div class="form-group">
                            <label for="ply_name">Full Name</label>
                            <input type="text" id="ply_name" name="name" value="Jisan Al banna" required>
                        </div>
                        <div class="form-group">
                            <label for="ply_email">Email Address <em>(Registered login email)</em></label>
                            <input type="email" id="ply_email" name="email" value="jisan@example.com" readonly>
                        </div>
                        <div class="form-group">
                            <label for="ply_phone">Phone Number</label>
                            <input type="tel" id="ply_phone" name="phone" value="01722222222" required>
                        </div>
                        <div class="form-group">
                            <label for="ply_address">Residential Address</label>
                            <input type="text" id="ply_address" name="address" value="Mirpur, Dhaka">
                        </div>
                        <input type="submit" value="Save Profile Updates" class="btn">
                        <input type="reset" value="Undo Changes" class="btn btn-outline">
                    </form>
                </section>
                <section class="card">
                    <h3 class="card-title">Update Password</h3>
                    <form action="profile.html" method="POST">
                        <div class="form-group">
                            <label for="curr_pass">Current Password</label>
                            <input type="password" id="curr_pass" name="current_password" required
                                placeholder="Enter current password">
                        </div>
                        <div class="form-group">
                            <label for="new_pass">New Password</label>
                            <input type="password" id="new_pass" name="new_password" required minlength="6"
                                placeholder="Minimum 6 characters">
                        </div>
                        <div class="form-group">
                            <label for="conf_pass">Confirm New Password</label>
                            <input type="password" id="conf_pass" name="confirm_password" required minlength="6"
                                placeholder="Re-type new password">
                        </div>
                        <input type="submit" value="Change Password" class="btn">
                    </form>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
