<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Settings - TurfGo Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-logo">⚽ TurfGo</div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="turf-pricing.html">Turf &amp; Pricing</a>
                <a href="staff-users.html">Staff &amp; Users</a>
                <a href="bookings.html">Bookings</a>
                <a href="payments.html">Payments</a>
                <a href="reports.html">Reports</a>
                <a href="settings.html" class="active">Settings</a>
                <a href="../index.html">Main Index</a>
                <a href="../logout.html">Logout</a>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="topbar-title">Account Settings</div>
                <div class="topbar-user">
                    <span class="role-badge">Admin</span>
                    <span>Admin Owner</span>
                    <div class="avatar">AO</div>
                </div>
            </header>
            <main class="content">
                <div class="page-header">
                    <h1>Admin Account Settings</h1>
                </div>

                <section class="card">
                    <h3 class="card-title">Administrator Profile Details</h3>
                    <form action="settings.html" method="POST">
                        <div class="form-group">
                            <label for="admin_name">Full Name:</label>
                            <input type="text" id="admin_name" name="name" value="Admin Owner" required>
                        </div>
                        <div class="form-group">
                            <label for="admin_email">Email Address: <em>(Email cannot be modified)</em></label>
                            <input type="email" id="admin_email" name="email" value="admin@turfgo.com" readonly>
                        </div>
                        <div class="form-group">
                            <label for="admin_phone">Phone:</label>
                            <input type="tel" id="admin_phone" name="phone" value="01700000000">
                        </div>
                        <div class="form-group">
                            <label for="admin_address">Office Address:</label>
                            <input type="text" id="admin_address" name="address" value="Mirpur, Dhaka">
                        </div>
                        <input type="submit" value="Save Profile Changes" class="btn">
                        <input type="reset" value="Undo Changes" class="btn btn-outline">
                    </form>
                </section>

                <section class="card">
                    <h3 class="card-title">Change Password</h3>
                    <form action="settings.html" method="POST">
                        <div class="form-group">
                            <label for="curr_pass">Current Password:</label>
                            <input type="password" id="curr_pass" name="current_password" required placeholder="Enter current password">
                        </div>
                        <div class="form-group">
                            <label for="new_pass">New Password:</label>
                            <input type="password" id="new_pass" name="new_password" required minlength="6" placeholder="Minimum 6 characters">
                        </div>
                        <div class="form-group">
                            <label for="conf_pass">Confirm New Password:</label>
                            <input type="password" id="conf_pass" name="confirm_password" required minlength="6" placeholder="Re-type new password">
                        </div>
                        <input type="submit" value="Update Password" class="btn">
                    </form>
                </section>

                <footer class="empty-state">&copy; 2026 TurfGo - Administrator Portal (Basic HTML Version).</footer>
            </main>
        </div>
    </div>
</body>
</html>
