<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Profile - TurfGo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-manager">
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-logo">⚽ TurfGo</div>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="manage-slots.html">Manage Slots</a>
                <a href="bookings.html">Bookings</a>
                <a href="check-in.html">Check-in</a>
                <a href="schedule.html">Schedule</a>
                <a href="profile.html" class="active">Profile</a>
                <a href="../logout.html">Logout</a>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="topbar-title">Manager Profile</div>
                <div class="topbar-user">
                    <span class="role-badge">Manager</span>
                    <span>Jahid Hasan</span>
                    <div class="avatar">JH</div>
                </div>
            </header>
            <main class="content">
                <div class="page-header">
                    <h1>Manager Profile &amp; Account Settings</h1>
                </div>
                <section class="card">
                    <h3 class="card-title">Manager Profile Details</h3>
                    <form action="profile.html" method="POST">
                        <div class="form-group">
                            <label for="mgr_name">Full Name:</label>
                            <input type="text" id="mgr_name" name="name" value="Jahid Hasan" required>
                        </div>
                        <div class="form-group">
                            <label for="mgr_email">Email Address: <em>(Official manager email)</em></label>
                            <input type="email" id="mgr_email" name="email" value="jahid@turfgo.com" readonly>
                        </div>
                        <div class="form-group">
                            <label for="mgr_phone">Phone:</label>
                            <input type="tel" id="mgr_phone" name="phone" value="01711111111">
                        </div>
                        <div class="form-group">
                            <label for="mgr_address">Address:</label>
                            <input type="text" id="mgr_address" name="address" value="Banani, Dhaka">
                        </div>
                        <input type="submit" value="Save Profile Details" class="btn">
                        <input type="reset" value="Undo Changes" class="btn btn-outline">
                    </form>
                </section>
                <section class="card">
                    <h3 class="card-title">Change Manager Account Password</h3>
                    <form action="profile.html" method="POST">
                        <div class="form-group">
                            <label for="curr_pass">Current Password:</label>
                            <input type="password" id="curr_pass" name="current_password" required placeholder="Enter current password">
                        </div>
                        <div class="form-group">
                            <label for="new_pass">New Password:</label>
                            <input type="password" id="new_pass" name="new_password" required minlength="6" placeholder="Minimum 6 characters">
                        </div>
                        <div class="form-group">
                            <label for="conf_pass">Confirm New Password:</label>
                            <input type="password" id="conf_pass" name="confirm_password" required minlength="6" placeholder="Re-enter new password">
                        </div>
                        <input type="submit" value="Update Password" class="btn">
                    </form>
                </section>
                <footer class="empty-state">&copy; 2026 TurfGo - Turf Manager Portal (Basic HTML Version).</footer>
            </main>
        </div>
    </div>
</body>
</html>
